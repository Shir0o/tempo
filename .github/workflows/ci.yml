name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        id: flutter
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Point Gradle at the Flutter SDK
        env:
          FLUTTER_SDK: ${{ steps.flutter.outputs.flutter-root }}
        run: echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties

      - name: Build the app
        run: flutter build apk --debug

      - name: Provide the Gradle wrapper
        run: |
          cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Compile the watch app
        working-directory: android
        run: ./gradlew :wear:compileDebugKotlin

  macos:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the macOS app
        run: flutter build macos --debug

      - name: Verify the signature
        run: codesign --verify --deep --strict build/macos/Build/Products/Debug/tempo.app

      - name: Verify no restricted entitlements
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Debug/tempo.app
          entitlements=$(codesign -d --entitlements :- "$app" 2>/dev/null || true)
          if grep -q "keychain-access-groups" <<<"$entitlements"; then
            echo "::error::macOS app requests keychain-access-groups, which needs a provisioning profile and is killed at launch when signed ad-hoc."
            exit 1
          fi

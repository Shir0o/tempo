name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Validate conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title against conventional-commit prefixes
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional commit prefixes that drive release-please bumps.
          # Keep in sync with release-please-config.json changelogSections.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR title must start with a lowercase conventional-commit prefix
            (e.g. `feat:`, `fix:`, `chore:`) and a lowercase subject.
            See RELEASING.md for the full list.

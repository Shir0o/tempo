<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tempo app icon (Day Ring, bold): one Day as a 24h ring from midnight at the top.
       Segments are hours (pathLength 24): sleep, morning, afternoon, then the open Lap in lime. -->
  <rect width="100" height="100" rx="22" fill="#0B0B0A"/>
  <g transform="rotate(-90 50 50)" fill="none" stroke-width="16">
    <circle cx="50" cy="50" r="27" pathLength="24" stroke="#262622"/>
    <circle cx="50" cy="50" r="27" pathLength="24" stroke="#9AA5C8" stroke-dasharray="6.6 24" stroke-dashoffset="0"/>
    <circle cx="50" cy="50" r="27" pathLength="24" stroke="#7CC8FF" stroke-dasharray="5.6 24" stroke-dashoffset="-7"/>
    <circle cx="50" cy="50" r="27" pathLength="24" stroke="#C3A6FF" stroke-dasharray="5.6 24" stroke-dashoffset="-13"/>
    <circle cx="50" cy="50" r="27" pathLength="24" stroke="#C6F432" stroke-dasharray="1.5 24" stroke-dashoffset="-19"/>
  </g>
</svg>

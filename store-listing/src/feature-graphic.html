<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #0B0B0A;
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative; width: 1024px; height: 500px;
    display: flex; align-items: center;
    padding: 0 72px;
  }
  .hatch {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      45deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 11px);
  }
  .copy { position: relative; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .brand svg { display: block; }
  .wordmark {
    font-size: 66px; font-weight: 700; letter-spacing: -0.04em;
    color: #FFFFFF; line-height: 1;
  }
  .tagline {
    font-size: 31px; font-weight: 500; line-height: 1.28;
    color: #E9E9E2; letter-spacing: -0.01em;
    margin: 0 0 22px 0;
  }
  .meta {
    font-size: 19px; font-weight: 700; letter-spacing: 0.09em;
    color: #A8A8A8; text-transform: uppercase;
  }
  .ring { position: relative; margin-left: auto; width: 356px; height: 356px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="hatch"></div>
    <div class="copy">
      <div class="brand">
        <svg width="54" height="54" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="22" fill="#1B1B18"/>
          <g transform="rotate(-90 50 50)" fill="none" stroke-width="16">
            <circle cx="50" cy="50" r="27" pathLength="24" stroke="#262622"/>
            <circle cx="50" cy="50" r="27" pathLength="24" stroke="#9AA5C8" stroke-dasharray="6.6 24" stroke-dashoffset="0"/>
            <circle cx="50" cy="50" r="27" pathLength="24" stroke="#7CC8FF" stroke-dasharray="5.6 24" stroke-dashoffset="-7"/>
            <circle cx="50" cy="50" r="27" pathLength="24" stroke="#C3A6FF" stroke-dasharray="5.6 24" stroke-dashoffset="-13"/>
            <circle cx="50" cy="50" r="27" pathLength="24" stroke="#C6F432" stroke-dasharray="1.5 24" stroke-dashoffset="-19"/>
          </g>
        </svg>
        <div class="wordmark">Tempo</div>
      </div>
      <p class="tagline">A plain record of<br>the whole day.</p>
      <div class="meta">Android &middot; Wear OS</div>
    </div>
    <div class="ring">
      <svg width="356" height="356" viewBox="0 0 100 100">
        <g transform="rotate(-90 50 50)" fill="none" stroke-width="16">
          <circle cx="50" cy="50" r="27" pathLength="24" stroke="#262622"/>
          <circle cx="50" cy="50" r="27" pathLength="24" stroke="#9AA5C8" stroke-dasharray="6.6 24" stroke-dashoffset="0"/>
          <circle cx="50" cy="50" r="27" pathLength="24" stroke="#7CC8FF" stroke-dasharray="5.6 24" stroke-dashoffset="-7"/>
          <circle cx="50" cy="50" r="27" pathLength="24" stroke="#C3A6FF" stroke-dasharray="5.6 24" stroke-dashoffset="-13"/>
          <circle cx="50" cy="50" r="27" pathLength="24" stroke="#C6F432" stroke-dasharray="1.5 24" stroke-dashoffset="-19"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
